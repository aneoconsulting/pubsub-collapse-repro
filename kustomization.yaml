apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - k8s/job.yaml
configMapGenerator:
  - name: pubsub-collapse-src
    namespace: pubsub-collapse
    files:
      - Program.cs
      - PubSubCollapse.csproj
  - name: pubsub-collapse-env
    namespace: pubsub-collapse
    literals:
      - PROJECT=my-gcp-project # the project where the test topic and subscription are created
