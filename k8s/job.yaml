apiVersion: v1
kind: Namespace
metadata:
  name: pubsub-collapse
---
# Needs roles/pubsub.editor on the project through Workload Identity (see README)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pubsub-collapse
  namespace: pubsub-collapse
---
# One pod: builds the code from the ConfigMap and runs `repro` with 3000 consumers
apiVersion: batch/v1
kind: Job
metadata:
  name: pubsub-collapse
  namespace: pubsub-collapse
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      annotations:
        # The run lasts ~15 min: keep the cluster autoscaler from removing the node under it
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: pubsub-collapse
      restartPolicy: Never
      containers:
        - name: repro
          image: mcr.microsoft.com/dotnet/sdk:10.0
          envFrom:
            - configMapRef:
                name: pubsub-collapse-env
          env:
            - name: DOTNET_CLI_TELEMETRY_OPTOUT
              value: "1"
          command: ["sh", "-c", "cp -r /src /work && cd /work && dotnet run -c Release -- repro \"$PROJECT\""]
          resources:
            requests: { cpu: "8", memory: 8Gi }
            limits: { cpu: "8", memory: 8Gi }
          volumeMounts:
            - { name: src, mountPath: /src }
      volumes:
        - name: src
          configMap:
            name: pubsub-collapse-src
